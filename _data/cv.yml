    - Nimbekar A, Katti P, Li C, et al. <b>Hardware-Software Co-optimised Fast and Accurate Deep Reconfigurable Spiking Inference Accelerator Architecture Design Methodology</b>. <i>IEEE International System-on-Chip Conference 2024 (SOCC)</i>.<br><small>Proposing a hardware accelerator for Spiking Neural Networks.</small>

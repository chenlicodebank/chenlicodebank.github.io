- title: Experience
  type: time_table
  contents:
    - title: Applied Scientist
      institution: "Algorithm Team, SpiNNcloud, Germany"
      year: 2025 - now
      description:
        - "Projects: EU-funded EdgeVision, EIC, PRIMI, etc."
        - Scaling LLM from 1B to 8B by sparse-aware pretraining and distilling.
        - Improving training throughput and stability via attention variants, MoE ablations, and optimizers (e.g., Muon).
        - Accelerated LLM inference efficiently by designing and deploying customized algorithms for AI chips.
        - Conducted joint academic and industry R&D spanning algorithm-hardware co-design to inform roadmap and technical strategy.
    - title: Research Associate (Postdoc)
      institution: "King's Laboratory for Intelligent Computing (PI: Prof. Bipin Rajendran), King's College London, UK"
      year: 2022 - 2024
      description:
        - "Project: NeuroSoC (EU-funded) — Achieving 100x energy efficiency (TOPS/W) through In-memory Computing."
        - "Led robustness improvements of MobileBERT, deploying it on IBM's analog chip, boosting chip noise resilience."
        - Fine-tuned LLAMA3.1 8B on Alpaca to enhance LLM performance on noisy hardware.
        - "Accelerated bio-inspired NNs by ~40% via decoding and uncertainty verifying (published at ICCV 2023)."
        - Created an integer-only NN inference engine for NN operations, optimizing inference efficiency.
        - "Coordinated with industry partners (STMicroelectronics, IBM, etc.); presented findings bi-weekly."
        - Authored the project deliverables for EU Commission review.
    - title: Research Assistant
      institution: "Advanced Processor Technologies (PI: Prof. Steve Furber), University of Manchester, UK"
      year: 2018 - 2022
      description:
        - "Project: SpiNNaker (EU flagship Human Brain Project) — simulating 1% human brain using 1 million ARM cores."
        - Led the first DNN deployment on the SpiNNaker brain-inspired hardware.
        - Enhanced accuracy and robustness of NNs mapped on room-temperature physical devices.
        - Developed an acceleration framework for building low-latency bio-inspired NNs, using information compression and denoising.
    - title: Research Intern
      institution: "Beijing Academy of Artificial Intelligence, China"
      year: Feb – Jun 2021
      description:
        - "Project: Neuromorphic Computing."
        - Developed low-latency neuromorphic algorithms.


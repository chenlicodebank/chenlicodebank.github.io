    - "Chen R, Li C, Li Y, et al. <b>Nanoscale Room-Temperature Multilayer Skyrmionic Synapse for Deep Spiking Neural Networks</b>. <i>Physical Review Applied</i>, 2020, 14(1): 014096.<br><small>Proposed an Analog-in-memory computing (AIMC) architecture to accelerate Spiking Neural Networks.</small>"
    - "Li C, Chen R, Moutafis C, et al. <b>Robustness to Noisy Synaptic Weights in Spiking Neural Networks</b>. <i>International Joint Conference on Neural Networks 2020</i> (IJCNN).<br><small>Demonstrated how noise in synapses affects neural network (both spiking and non-spiking) performance.</small>"


    - "Nimbekar A, Katti P, Li C, et al. <b>Hardware-Software Co-optimized Inference Accelerator for Deep Spiking Networks</b>. <i>IEEE International System-on-Chip Conference 2024</i> (SOCC).<br><small>Proposing a hardware accelerator for Spiking Neural Networks.</small>"
    - "Katti P, Nimbekar A, Li C, et al. <b>Bayesian Inference Accelerator for Spiking Neural Networks</b>. <i>IEEE International Symposium on Circuits and Systems 2024</i> (ISCAS).<br><small>Developed a Bayesian accelerator to enhance the performance of Bayesian Spiking Neural Networks.</small>"

- title: Selected Projects and Competitions
  type: time_table
  contents:
    - title: QuantiPhy Challenge (NeurIPS 2026 Competition Track) — 2nd in the Main Track, 3rd in the Open-Weight Track
      year: "2026"
      institution: Team Cookie, side project with Luhui (May) Liu
      description:
        - "Built coding-agent pipelines that answer quantitative physics questions about videos by measuring in code: a question-blind scene record per video, then one fresh agent session per question that measures and converts pixels to metres."
        - "Open-Weight Track: DeepSeek-V4.1-Flash in the DeepSeek Harness with SAM 3 segmentation and tracking as tools, taking the median of 2 to 6 sessions per question. Main Track: Claude Opus in Claude Code, combined per question with that median."
        - Released the <a href="https://github.com/chenlicodebank/quantiphy-2026-team-cookie" target="_blank">code, method and recorded outputs</a>, which rebuild both submissions byte for byte.
    - title: MARS2 2026 Multimodal Reasoning Challenge (ECCV 2026) — 3rd in Video Temporal Grounding
      year: "2026"
      institution: Team Saucy, side project with Luhui (May) Liu
      description:
        - Post-trained Qwen3-VL-4B with GRPO on a temporal IoU reward, driven by a timestamped audio-evidence timeline; top six in all three tracks.
        - Released the <a href="https://github.com/chenlicodebank/mars2-saucy-eccv2026" target="_blank">code</a> and <a href="https://huggingface.co/chenliforai/mars2-saucy-aet-grpo-requeued" target="_blank">model weights</a>.

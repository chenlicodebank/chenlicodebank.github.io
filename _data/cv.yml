- title: Expertise and Research Approach
  type: list
  contents:
    - "<b>Architecture Retrofitting and Post-Training</b>: I retrofit pretrained LLMs with more efficient architectures and repair them with continued training. I designed post-hoc sparse attention for GQA LLMs; at a 50% attention budget it matches dense-model accuracy on long-context benchmarks (RULER retention 98.5% at 16K). I measured which key/value-cache compressions continued pretraining can repair (ICLR 2027, under review). I post-train LLMs and vision-language models with reinforcement learning (GRPO), and improve training throughput and stability through attention variants, MoE ablations and optimizers such as Muon."
    - "<b>Test-Time Reasoning and Decoding</b>: I placed 2nd in the Main Track and 3rd in the Open-Weight Track of the QuantiPhy Challenge (NeurIPS 2026) with coding agents that answer each question about a video by measuring it in code. My sparse-attention decode path runs 2.44x faster per token than compiled dense FlashAttention at 16K context on GH200 (3.22x at 64K). Earlier I proposed a decoding method based on temporal confidence that accelerated spiking networks by ~40% (ICCV 2023). I developed algorithms for quantization, denoising and test-time decoding, and improved model reliability through uncertainty calibration, supervised fine-tuning and Low-Rank Adaptation (LoRA)."
    - "<b>AI Agents and Self-Improvement</b>: I build agent systems that improve under measurement. I run my research and competition entries through fleets of coding agents and judge their results against measured evaluations, and a change to my agent control plane is kept only when a test fails before it and passes after it."
    - "<b>Hardware Background</b>: I have hands-on deployment experience on diverse hardware platforms, including GPUs, neuromorphic hardware (SpiNNaker and SpiNNaker2), and analog AI chips (prototyped by IBM), optimizing performance for CNNs and transformers."
    - "<b>Leadership and Collaboration</b>: I have led research projects from idea to publication, assembling the teams myself, and delivered in multidisciplinary teams of over 50 members."
    - "<b>Technical Skills</b>: Python, PyTorch, TorchTitan; training on GH200 machines and Slurm clusters (MareNostrum 5); Claude Code, Codex."
